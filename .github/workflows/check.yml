name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check skill, recipes, links, JSON, assets
        run: npm run lint

      - name: Test the deterministic audit
        run: npm run lint:audit-test

      - name: Compare against the local reference checkout when present
        run: npm run lint:originality
